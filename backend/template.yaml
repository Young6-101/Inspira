AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Inspira Database Infrastructure (DynamoDB Tables)

Parameters:
  Environment:
    Type: String
    Default: dev
    Description: Environment name (dev, staging, prod)

Resources:
  # =================== DynamoDB TABLES ===================
  
  # Files metadata table
  FilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "inspira-files-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: filename
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: filename
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: Inspira
        - Key: Environment
          Value: !Ref Environment

  # Chat sessions table
  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "inspira-sessions-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: session_id
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: Inspira
        - Key: Environment
          Value: !Ref Environment

  # Async tasks table
  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "inspira-tasks-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: task_id
          AttributeType: S
      KeySchema:
        - AttributeName: task_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: Inspira
        - Key: Environment
          Value: !Ref Environment

  # =================== S3 BUCKET (File Storage) ===================
  
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "inspira-uploads-${Environment}-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - POST
              - DELETE
            AllowedOrigins:
              - "*"  # TODO: Restrict to your domain in production
            MaxAge: 3600
      Tags:
        - Key: Project
          Value: Inspira
        - Key: Environment
          Value: !Ref Environment

Outputs:
  FilesTableName:
    Description: Files metadata table name
    Value: !Ref FilesTable
    Export:
      Name: !Sub "${AWS::StackName}-FilesTable"

  SessionsTableName:
    Description: Sessions table name
    Value: !Ref SessionsTable
    Export:
      Name: !Sub "${AWS::StackName}-SessionsTable"

  TasksTableName:
    Description: Tasks table name
    Value: !Ref TasksTable
    Export:
      Name: !Sub "${AWS::StackName}-TasksTable"

  UploadBucketName:
    Description: Upload S3 bucket name
    Value: !Ref UploadBucket
    Export:
      Name: !Sub "${AWS::StackName}-UploadBucket"

  Region:
    Description: AWS Region
    Value: !Ref AWS::Region