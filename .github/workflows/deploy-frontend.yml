name: Deploy Frontend to S3 + CloudFront

on:
  push:
    branches:
      - 'frontend-v2'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect frontend directory
        run: |
          if [ -d "frontend" ]; then
            echo "FRONTEND_DIR=frontend" >> "$GITHUB_ENV"
          elif [ -d "frontend v2" ]; then
            echo "FRONTEND_DIR=frontend v2" >> "$GITHUB_ENV"
          elif [ -f "package.json" ] && [ -d "src" ]; then
            echo "FRONTEND_DIR=." >> "$GITHUB_ENV"
          else
            echo "No frontend directory found (expected 'frontend', 'frontend v2', or repo root frontend layout)." >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Build
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_OPENAI_API_KEY: ${{ secrets.VITE_OPENAI_API_KEY }}
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1 

      - name: Deploy to S3
        run: aws s3 sync "./${{ env.FRONTEND_DIR }}/dist/" s3://inspira-frontend-2026/ --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E2ITQ5FXNVHFQW --paths "/*"